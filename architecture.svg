<svg viewBox="0 0 1260 750" role="img" aria-label="End-to-end architecture: submissions enter through Caddy to FastAPI, which saves originals in MinIO and queues jobs in Redis; a background worker transcribes, masks, embeds and labels each case with Ollama, scores it in Python, saves it to PostgreSQL with pgvector and triggers the notifier for critical cases." xmlns="http://www.w3.org/2000/svg"><style>
.b{stroke-width:1.4}
.b.actor{fill:#F4F7F7;stroke:#56686B;stroke-dasharray:4 3}
.b.edge{fill:#E2F1EF;stroke:#0D6B66}
.b.app{fill:#FFFFFF;stroke:#162427}
.b.store{fill:#E8F0F8;stroke:#2C5A88}
.b.async{fill:#FAF2E2;stroke:#946510}
.b.ai{fill:#F0ECF8;stroke:#6A4CA6}
.b.alert{fill:#FAE9E5;stroke:#BC3B27}
.b.dec{fill:#FFFFFF;stroke:#162427;stroke-dasharray:5 3}
.b.neutral{fill:#FFFFFF;stroke:#56686B}
.b.tool{fill:#FFFFFF;stroke:#6A4CA6}
.tt{font:600 13px 'IBM Plex Sans',Helvetica,Arial,sans-serif;fill:#162427}
.tt.mono{font:500 12px 'IBM Plex Mono',Menlo,Consolas,monospace}
.ts{font:400 11.5px 'IBM Plex Sans',Helvetica,Arial,sans-serif;fill:#56686B}
.ts.mono{font:400 11.5px 'IBM Plex Mono',Menlo,Consolas,monospace;fill:#162427}
.lbl{font:400 10.5px 'IBM Plex Mono',Menlo,Consolas,monospace;fill:#56686B}
.hotl{fill:#BC3B27}
.netl{font:500 11px 'IBM Plex Mono',Menlo,Consolas,monospace;fill:#56686B;letter-spacing:.02em}
.ln{fill:none;stroke:#7A8B8E;stroke-width:1.5}
.ln.hot{stroke:#BC3B27;stroke-width:1.8}
.ln.dash{stroke-dasharray:5 4}
.ah{fill:#7A8B8E}
.ah-hot{fill:#BC3B27}
.net{fill:none;stroke:#56686B;stroke-width:1.2;stroke-dasharray:7 5}
.badge{fill:#BC3B27}
.badge-t{font:600 9.5px 'IBM Plex Mono',Menlo,Consolas,monospace;fill:#FFFFFF}
</style><rect width="1260" height="750" fill="#F4F7F7"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker><marker id="a1-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah-hot" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="net" x="268" y="28" width="980" height="712" rx="10"/><text class="netl" x="288" y="730" text-anchor="start">Private Docker network  ·  only Caddy is reachable from outside (ports 80 / 443)</text><rect class="b actor" x="20" y="80" width="160" height="66" rx="6"/><text class="tt" x="30" y="100">Field worker</text><text class="ts" x="30" y="116">iPad · KoboCollect</text><text class="ts" x="30" y="132">works offline</text><rect class="b actor" x="20" y="176" width="160" height="66" rx="6"/><text class="tt" x="30" y="196">KoboToolbox server</text><text class="ts" x="30" y="212">external service</text><text class="ts" x="30" y="228">sends a webhook</text><rect class="b actor" x="20" y="318" width="160" height="66" rx="6"/><text class="tt" x="30" y="338">Office staff, officers</text><text class="ts" x="30" y="354">browser</text><text class="ts" x="30" y="370">uploads, dashboard, chat</text><rect class="b actor" x="20" y="610" width="160" height="66" rx="6"/><text class="tt" x="30" y="630">Team leader, supervisor</text><text class="ts" x="30" y="646">receives alerts</text><text class="ts" x="30" y="662">confirms in dashboard</text><polyline class="ln" points="100,146 100,176" marker-end="url(#a1)"/><text class="lbl" x="108" y="166" text-anchor="start">syncs when online</text><rect class="b edge" x="212" y="80" width="112" height="340" rx="6"/><text class="tt" x="222" y="100">Caddy</text><text class="ts" x="222" y="116">only public</text><text class="ts" x="222" y="132">entrance</text><text class="ts" x="222" y="148"></text><text class="ts" x="222" y="164">HTTPS</text><text class="ts" x="222" y="180">rate limits</text><text class="ts" x="222" y="196">routing</text><circle class="badge" cx="318" cy="86" r="10"/><text class="badge-t" x="318" y="89.5" text-anchor="middle">E1</text><polyline class="ln" points="180,209 212,209" marker-end="url(#a1)"/><polyline class="ln" points="180,351 212,351" marker-end="url(#a1)"/><polyline class="ln" points="324,209 375,209" marker-end="url(#a1)"/><text class="lbl" x="350" y="202" text-anchor="middle">/kobo</text><polyline class="ln" points="324,351 375,351" marker-end="url(#a1)"/><text class="lbl" x="350" y="344" text-anchor="middle">/</text><rect class="b app" x="375" y="80" width="175" height="190" rx="6"/><text class="tt" x="385" y="100">FastAPI</text><text class="ts" x="385" y="116">verifies Kobo submissions</text><text class="ts" x="385" y="132">saves original</text><text class="ts" x="385" y="148">queues the job</text><text class="ts" x="385" y="164">chat: history, RAG, tools</text><text class="ts" x="385" y="180">streams answers</text><circle class="badge" cx="544" cy="86" r="10"/><text class="badge-t" x="544" y="89.5" text-anchor="middle">E2</text><rect class="b app" x="375" y="318" width="175" height="100" rx="6"/><text class="tt" x="385" y="338">Streamlit</text><text class="ts" x="385" y="354">region dashboard</text><text class="ts" x="385" y="370">uploads</text><text class="ts" x="385" y="386">chat (streamed)</text><polyline class="ln" points="462,318 462,270" marker-end="url(#a1)"/><text class="lbl" x="470" y="299" text-anchor="start">REST</text><rect class="b store" x="600" y="80" width="235" height="56" rx="6"/><text class="tt" x="610" y="100">MinIO</text><text class="ts" x="610" y="116">originals: forms, audio, video, files</text><polyline class="ln" points="550,108 600,108" marker-end="url(#a1)"/><text class="lbl" x="575" y="101" text-anchor="middle">save</text><rect class="b async" x="600" y="160" width="235" height="50" rx="6"/><text class="tt" x="610" y="180">Redis</text><text class="ts" x="610" y="196">job queue</text><polyline class="ln" points="550,185 600,185" marker-end="url(#a1)"/><text class="lbl" x="575" y="178" text-anchor="middle">enqueue</text><rect class="b async" x="600" y="245" width="255" height="300" rx="6"/><text class="tt" x="610" y="265">Background worker</text><text class="ts mono" x="612" y="289">1  consent? questionnaire complete?</text><text class="ts mono" x="612" y="315">2  closed answers → Python rules</text><text class="ts mono" x="612" y="341">3  ffmpeg + Whisper (audio, video)</text><text class="ts mono" x="612" y="367">4  Presidio masks names, phones</text><text class="ts mono" x="612" y="393">5  chunk + embed</text><text class="ts mono" x="612" y="419">6  llama3.2 labels 10 indicators</text><text class="ts mono" x="612" y="445">7  validate schema + quotes</text><text class="ts mono" x="612" y="471">8  score + band in Python</text><text class="ts mono" x="612" y="497">9  save; alert if urgent</text><circle class="badge" cx="849" cy="251" r="10"/><text class="badge-t" x="849" y="254.5" text-anchor="middle">E3</text><polyline class="ln" points="717,210 717,245" marker-end="url(#a1)"/><text class="lbl" x="725" y="232" text-anchor="start">next job</text><rect class="b ai" x="880" y="300" width="160" height="140" rx="6"/><text class="tt" x="890" y="320">Ollama</text><text class="ts" x="890" y="336">llama3.2</text><text class="ts" x="890" y="352">labels, answers,</text><text class="ts" x="890" y="368">chooses tools</text><text class="ts" x="890" y="384">embeddinggemma</text><text class="ts" x="890" y="400">768-dim vectors</text><polyline class="ln" points="855,400 880,400" marker-end="url(#a1)"/><rect class="b store" x="1072" y="80" width="165" height="210" rx="6"/><text class="tt" x="1082" y="100">PostgreSQL</text><text class="ts" x="1082" y="116">+ pgvector</text><text class="ts" x="1082" y="132">cases + risk bands</text><text class="ts" x="1082" y="148">assessments + quotes</text><text class="ts" x="1082" y="164">chunks + vectors:</text><text class="ts" x="1082" y="180">  masked case text</text><text class="ts" x="1082" y="196">  8 policy documents</text><text class="ts" x="1082" y="212">alerts + status</text><text class="ts" x="1082" y="228">chat sessions</text><polyline class="ln" points="520,80 520,52 1155,52 1155,80" marker-end="url(#a1)"/><polyline class="ln" points="960,52 960,300" marker-end="url(#a1)"/><text class="lbl" x="700" y="45" text-anchor="middle">chat: retrieval, SQL statistics, session history</text><text class="lbl" x="952" y="180" text-anchor="end">generate answer,</text><text class="lbl" x="952" y="194" text-anchor="end">call tools, stream</text><polyline class="ln" points="855,497 1120,497 1120,290" marker-end="url(#a1)"/><text class="lbl" x="975" y="490" text-anchor="middle">case, band, vectors</text><rect class="b alert" x="600" y="600" width="235" height="70" rx="6"/><text class="tt" x="610" y="620">Notifier</text><text class="ts" x="610" y="636">alerts team leader + supervisor</text><text class="ts" x="610" y="652">escalates until confirmed</text><circle class="badge" cx="829" cy="606" r="10"/><text class="badge-t" x="829" y="609.5" text-anchor="middle">E4</text><polyline class="ln hot" points="717,545 717,600" marker-end="url(#a1-hot)"/><text class="lbl hotl" x="725" y="566" text-anchor="start">urgent: critical 1, 2, 5, 6 · immediate danger</text><text class="lbl hotl" x="725" y="580" text-anchor="start">self-harm · refused with serious concern</text><polyline class="ln hot" points="600,643 180,643" marker-end="url(#a1-hot)"/><text class="lbl hotl" x="390" y="636" text-anchor="middle">alert, then escalation</text><polyline class="ln" points="835,640 1200,640 1200,290" marker-end="url(#a1)"/><text class="lbl" x="1015" y="633" text-anchor="middle">alert status</text></svg>