# =====================================================================
# AI CARE Assistant
# Postgres (with pgvector) + Redis + RustFS (S3 storage for originals)
# + the API, the worker and the Streamlit pages (one image, built here)
# + Caddy, the only public entrance (HTTPS, routing)
#
# Ollama runs on the computer itself, outside Docker, where it can use
# the graphics chip; the containers reach it at host.docker.internal.
#
#   docker compose up -d --build     # build the app image and start everything
#   docker compose ps                # check status
#   docker compose logs -f worker    # follow the worker's log
#   docker compose down              # stop
# =====================================================================

services:

  # Postgres with pgvector: cases, assessments, vectors
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicare_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aicare_net

  # Redis: job queue for the background worker
  redis:
    image: redis:7-alpine
    container_name: aicare_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aicare_net

  # RustFS: S3-compatible storage for the untouched originals
  # (Kobo forms, call reports, recordings, uploaded files).
  # MinIO stopped publishing its images in 2025; the app uses the standard S3
  # interface, so this can be replaced by SeaweedFS or a paid store by config only.
  rustfs:
    image: rustfs/rustfs:1.0.3
    container_name: aicare_rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:9000:9000"   # S3 interface used by the app
      - "127.0.0.1:9001:9001"   # web console, to browse the stored files
    volumes:
      # A Docker volume (a real Linux disk inside Docker), not a Mac folder:
      # RustFS saves files by renaming them, which a shared Mac folder does not support.
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - aicare_net

  # ------------------------------------------------------------------
  # The API (FastAPI): Kobo webhook, office intake, alerts, cases, chat.
  # Not published: it is reached only through Caddy (and by the ui).
  # ------------------------------------------------------------------
  api:
    build: .
    image: aicare-app:1.0
    container_name: aicare_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Inside Docker the other services are found by name, not on localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_URL: http://rustfs:9000
      # Ollama runs on the computer itself, outside Docker, where it can use the graphics chip.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8000/openapi.json"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    networks:
      - aicare_net

  # ------------------------------------------------------------------
  # The worker: assesses each case, saves it, sends alerts.
  # Whisper's model is kept in a volume, so it is downloaded only once.
  # ------------------------------------------------------------------
  worker:
    image: aicare-app:1.0
    container_name: aicare_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      STORAGE_URL: http://rustfs:9000
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    command: ["python", "worker.py"]
    volumes:
      - whisper_models:/root/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aicare_net

  # ------------------------------------------------------------------
  # The Streamlit pages: dashboard, uploads, chat. Reached only through Caddy.
  # ------------------------------------------------------------------
  ui:
    image: aicare-app:1.0
    container_name: aicare_ui
    restart: unless-stopped
    env_file: .env
    environment:
      API_URL: http://api:8000
    command: ["streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501",
              "--server.headless=true"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - aicare_net

  # ------------------------------------------------------------------
  # Caddy: the only public entrance. HTTPS, and routing:
  #   /kobo and /health -> the API;  everything else -> the Streamlit pages.
  # On a server, DOMAIN in .env is the real address; on a laptop, localhost.
  # ------------------------------------------------------------------
  caddy:
    image: caddy:2.8.4
    container_name: aicare_caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - api
      - ui
    networks:
      - aicare_net

networks:
  aicare_net:

volumes:
  rustfs_data:
  whisper_models:
  caddy_data:
